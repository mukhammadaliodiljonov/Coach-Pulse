spring.application.name=demo

server.port=${SERVER_PORT:8080}

# Supabase PostgreSQL
spring.datasource.url=jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.hahjbqacvltoeqzejusq
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# JWT signing and validation. Provide a random secret of at least 32 bytes via the environment.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=PT15M

# Frontend origins allowed to call the API from another origin, comma-separated (e.g. https://app.example.com).
# Empty means same-origin only. The dev server proxies /api, so local development doesn't need it.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
