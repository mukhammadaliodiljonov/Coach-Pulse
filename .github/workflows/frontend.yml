name: Frontend CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # LTS; React Router 8 needs Node 22.22 or newer
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Serve the production build and check that a page and its script load
      - name: Run
        run: |
          npm run preview -- --port 4173 --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fs http://localhost:4173/athletes -o page.html && break
            sleep 1
          done
          grep -q '<div id="root"></div>' page.html || { cat preview.log; exit 1; }
          script=$(grep -o 'src="/assets/[^"]*\.js"' page.html | cut -d'"' -f2)
          curl -fsS "http://localhost:4173$script" -o /dev/null
          echo "Served $script"
